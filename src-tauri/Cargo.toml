[package]
name = "edit-class"
version = "0.1.1"
description = "class编辑器 - 替换 Java class 文件中的字符串"
authors = ["editclass"]
edition = "2021"

[lib]
name = "edit_class_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
thiserror = "1"
encoding_rs = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
